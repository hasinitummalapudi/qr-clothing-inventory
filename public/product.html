<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Product Details</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
        }

        .container {
            max-width: 600px;
            margin: 60px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            color: #111827;
        }

        .product {
            text-align: left;
            margin-top: 25px;
        }

        .product p {
            font-size: 18px;
            margin: 12px 0;
        }

        .qr {
            margin-top: 25px;
        }

        .qr img {
            width: 220px;
        }

        .back {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 20px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Clothing Product</h1>

    <div id="productDetails">
        Loading product...
    </div>

    

   

</div>




  

  
<script>
const params = new URLSearchParams(window.location.search);
const productId = params.get("id");

async function loadProduct() {
    const details = document.getElementById("productDetails");

    if (!productId) {
        details.textContent = "Product ID is missing.";
        return;
    }

    try {
        details.textContent = "Loading product...";

        const response = await fetch(
            `/api/product/${encodeURIComponent(productId)}/qr`
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.message || "Product not found.");
        }

        const product = data.product;

        details.innerHTML = `
            <div class="product">
                <p><strong>Product:</strong> ${product.name}</p>
                <p><strong>Category:</strong> ${product.category}</p>
                <p><strong>Size:</strong> ${product.size}</p>
                <p><strong>Price:</strong> ₹${product.price}</p>
                <p><strong>Available Stock:</strong> ${product.stock}</p>
            </div>
        `;
    } catch (error) {
        details.textContent = "Unable to load product: " + error.message;
    }
}

loadProduct();


</script>



</body>

</html>
